adv: True            # enable the discriminator

path:
  raw_path: "/data/yizwen/LibriSpeech_wav"
  ckpt: "results/ckpt/"
  log_path: "results/log/"

watermark:
  length: 10                # message length in bits
  delay_amt_second: 0.5     # hop between successive watermark chunks
  future_amt_second: 0.5    # lookahead the encoder is allowed

optimize:
  lr: 0.0001
  # Loss weights. See the note in the README: with lambda_m applied as
  # configured, the perceptual terms need retuning against it.
  lambda_e: 1.       # waveform MSE
  lambda_m: 10.      # message MSE
  lambda_b: 1.       # TF-loudness
  lambda_a: 0.01     # adversarial
  batch_size: 8      # remote batch_size=8, local batch_size=2
  step_size: 5000    # large value means do not decay
  gamma: 0.98
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  distortion: true          # RIR + noise + bandpass before decoding

iter:
  epoch: 50
  save_circle: 5      # checkpoint every N epochs
  show_circle: 1000   # log every N steps
  data_divider: 1     # train on 1/N of the data

wandb:
  enabled: true
  project: "real-time-voice-watermark"
  name: "vad_50ep_lmeff0.01_band300-3400_sameRIR"
  # API key is read from the WANDB_API_KEY environment variable.
  # Do not commit a key here.
